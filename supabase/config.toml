project_id = "lz-advogados"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/update-password", "http://127.0.0.1:5173/auth/update-password"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 12

[auth.email]
# Enables the email provider; public signup remains blocked by [auth].enable_signup.
enable_signup = true
enable_confirmations = true
secure_password_change = true

[auth.mfa]
max_enrolled_factors = 3

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.admin-users]
# The handler validates the bearer token with Auth and getClaims, supporting
# both legacy and asymmetric project signing keys. A project API key is not a user.
verify_jwt = false
import_map = "./functions/deno.json"
